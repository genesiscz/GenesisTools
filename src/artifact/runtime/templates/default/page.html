<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{THEME}}</style>
<style>
        * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.7 var(--font-body);
        padding: clamp(1.5rem, 4vw, 3.5rem) 1.25rem 4rem;
    }
    article { max-width: 46rem; margin: 0 auto; }
    h1, h2, h3, h4 { line-height: 1.25; letter-spacing: -0.01em; color: #eef2f8; }
    h1 { font-size: clamp(1.5rem, 3.5vw, 2rem); }
    h2 { margin-top: 2.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre {
        font-family: var(--font-code);
        font-size: 0.88em;
    }
    code { background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 0.1em 0.35em; }
    pre { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; overflow-x: auto; }
    pre code { background: none; border: none; padding: 0; }
    blockquote { margin: 1rem 0; padding: 0.25rem 1rem; border-left: 3px solid var(--accent); color: var(--dim); }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 0.45rem 0.7rem; text-align: left; }
    th { background: var(--panel); }
    img { max-width: 100%; border-radius: 10px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
</style>
</head>
<body>
<article>{{CONTENT}}</article>
</body>
</html>
