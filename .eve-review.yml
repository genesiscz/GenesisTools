# eve PR review (docs: eve-ai-layer docs/eve-review-config.md). Read at the PR head.
# Show every finding the verifier is at least 75% sure of, whatever its severity,
# and give big stacked PRs the full tool budget instead of a degraded pass.
severityFloor: info
confidenceFloor: 75
maxComments: 100
verdictPosture: gating
summaryVerbosity: standard
depth:
  mode: always
  maxToolSteps: 24
# Big PRs (+12k lines in 125 files) lost 13-44 patches to the 600k diff budget,
# and a pass with a gap re-reviewed the whole PR on every push. Large-PR mode
# reviews every patch in slices and carries what it misses into the next push.
largePrMode: auto
# The reviewer's typecheck checks only the changed files, their callers and the
# global declarations, not the whole root program (~5 GB, out of memory or time in
# about 100 of 949 reviews): about 1.0-1.3 GB and under 2 s on TypeScript 7. Its
# compiler errors are evidence for the finder and verifier; CI stays the gate.
checks:
  typecheck: true
  typecheckScope: changed
