name: CI

on:
  push:
    branches: [master, main]
  # Every base branch, so stacked PRs get CI too. Drafts are skipped by the
  # job-level `if` below and run once the PR is marked ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  # Decide which OSes the test matrix runs on.
  # ubuntu always; windows-latest only when the PR opts in via title/label
  # containing "windows" (case-insensitive), or on manual workflow_dispatch.
  setup:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Emit `include` objects so each OS carries its own testTimeout —
          # referenced as ${{ matrix.testTimeout }} (a plain matrix int IS
          # valid in step-level timeout-minutes; only non-matrix contexts /
          # raw ternaries are rejected there).
          # ubuntu: the full suite plus its serial phase finished in 205-215 s on the
          # 4-vCPU runner when this budget was written (2026-09-09, runs 34386793154 and
          # 34387174349), so 4m left ~30 s of margin. The suite has since outgrown it. The
          # six runs up to 2026-09-14 took 241, 243, 244, 246, 252 and 253 s, every one
          # over the 240 s budget. GitHub's timeout poll carries a few seconds of slop, so
          # 241-246 s survived while 252-253 s were killed: the same tree passed or failed
          # by luck. A kill surfaces as the completion-marker guard below reporting a HANG,
          # which is what it looked like on run 34839337972, so the misleading signal is
          # the budget, not a stall. 5m puts ~47 s of margin over the slowest measured run
          # and keeps that guard meaningful. The
          # task/tests integration lane is gated out of the default suite (see
          # package.json `test`) and run on demand via `bun run test:task`, so it is not
          # part of this step's budget.
          # windows: the old note read "med 136s / healthy ~150s -> 7m" and is stale by an
          # order of magnitude. Measured 2026-09-15 on three dispatched runs, the step is
          # KILLED at 7m every time, on PR branches AND on master 8a85b394e (run
          # 34913953290), having printed ~10.6k of ~11k pass lines. So it is a budget
          # overrun, not a hang, and the completion-marker guard below was reporting the
          # wrong cause.
          # ⚠️ 11m was then set from a SINGLE clean sample of 8m40s and was not enough: run
          # 35000784853 ran the step 668s and was truncated at the budget anyway. Windows
          # runners vary about 30% (the same spread the per-file ceiling in
          # scripts/ci/test-runtime-guard.ts is a share for), so 520s and 668s+ are the same
          # tree on two runners. 15m is set from the SLOW end plus margin, and still catches a
          # real stall, because a hang does not finish at any budget. Do not re-derive this
          # from one green run.
          inc='{"os":"ubuntu-latest","testTimeout":5}'
          win=false
          if [ "$EVENT" = "workflow_dispatch" ]; then win=true; fi
          title_lc=$(printf '%s' "$PR_TITLE" | tr '[:upper:]' '[:lower:]')
          labels_lc=$(printf '%s' "$PR_LABELS" | tr '[:upper:]' '[:lower:]')
          case "$title_lc" in *windows*) win=true ;; esac
          case "$labels_lc" in *windows*) win=true ;; esac
          if [ "$win" = "true" ]; then inc="$inc, {\"os\":\"windows-latest\",\"testTimeout\":15}"; fi
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          echo "Selected matrix include: [$inc] (windows opted-in: $win)"

  # The test matrix and nothing else. Lint, typecheck, the guards and the sub-project
  # suites live in `checks` below and run alongside this job, so they cannot delay the
  # test signal and this job's wall time is the suite's wall time.
  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Backstop only — must exceed the per-OS testTimeout (5m/15m) + cold install
    # (windows measured 204s cache + 53s install on run 35000784853) so the step
    # tripwires and Upload logs fire first and name the real cause. Windows worst
    # case is ~15m + ~5m of setup; 25m has margin. Lint and tsc are no longer in
    # this job at all — see `checks`.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The frozen history parity oracle archives a pinned commit out of this clone, and
      # actions/checkout fetches depth 1, so without this every oracle suite skips and the
      # Claude search / statistics parity signal silently disappears from CI. One commit at
      # depth 1 is cheap. Never fails the job: the suites fall back to skipping.
      - name: Fetch the frozen history baseline commit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rev=$(sed -n 's/^export const BASELINE_REVISION = "\([0-9a-f]\{40\}\)";$/\1/p' \
            src/utils/agent-sessions/testing/baseline-oracle.ts)
          if [ -z "$rev" ]; then
            echo "BASELINE_REVISION not found in baseline-oracle.ts" >&2
            exit 1
          fi
          if git cat-file -e "$rev^{commit}"; then
            echo "baseline $rev already present"
            exit 0
          fi
          git fetch --depth=1 origin "$rev"
          git cat-file -e "$rev^{commit}"
          echo "fetched baseline $rev"

      # 🛑 1.4.2 here is a CI choice, not a repo-wide requirement: the code must keep working
      # on 1.3.13, which is what developers run. Do not use a 1.4-only API because CI is green.
      #
      # Why it moved (measured 2026-09-15, same tree, same runner class): 1.3.13 leaks one
      # directory fd per directory the test scanner visits (oven-sh/bun 39783, fixed by 40016),
      # and past the fd ceiling every spawn slows down. The step ran 266 s on 1.3.13 and 90 s on
      # 1.4.2 — ~75% of worker time was overhead rather than tests. ⚠️ 1.4.0 is NOT enough; it
      # turns the resulting hang into an EBADF fast-fail. 1.4.1 is the first version with both
      # fixes. See the block comment in scripts/test.ts for the local side of this.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The hosted images ship no ripgrep (actions/runner-images#12179, closed
      # NOT_PLANNED) and the history search, the shell-quirks extractor and the
      # fable enumerator shell out to it. A prebuilt release binary lands on
      # PATH in a few seconds; no apt, no sudo. PATH is now the only source
      # (src/utils/ripgrep.ts), so dropping this step turns ripgrep.test.ts red.
      - name: Install ripgrep
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: ripgrep@14.1.1

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Discovery phase: capture how far install gets on each OS too.
      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee "install-${{ runner.os }}.log"

      # Run the WHOLE suite. Discovery only — never fail the job here; the
      # signal is the log, not the exit code. bun test continues past failing
      # files, so one log = full failure inventory for this OS.
      # Tripwire: per-OS matrix.testTimeout (ubuntu 5m, windows 15m). A plain
      # matrix int IS valid in step-level timeout-minutes (matrix resolves at
      # job-expansion); only raw ternaries / non-matrix contexts are rejected.
      # On timeout the partial tee'd log still uploads (continue-on-error).
      - name: Run tests (full suite, discovery)
        id: tests
        continue-on-error: true
        timeout-minutes: ${{ matrix.testTimeout }}
        shell: bash
        env:
          # The orphan-worker guard forks a /bin/sh watchdog per worker that execs
          # `sleep 1` every second. On a 4-vCPU runner those forks pile up as the run
          # goes on: minute-two throughput fell from ~2,900 to ~1,600 tests and the
          # suite never reached the budget, while the same tree with the guard off
          # finished all 10,211 tests in 209 s (bisect 2026-09-09, runs 34371400960
          # vs 34371404874/34371445859; reverting the toon bump changed nothing).
          # A CI VM is discarded after the job, so there is no orphan to guard against.
          GENESIS_TOOLS_TEST_ALLOW_ORPHAN_WORKERS: "1"
          # DevDashboard ships its own runners (bun for the mobile units, WDIO for
          # the Appium specs, vitest for the cloud). bun's discovery swallows all
          # three, so the 34 WDIO/Playwright specs error on an undefined `this.skip`
          # and the cloud files cannot load better-sqlite3. Those phantoms are cheap;
          # the 97 files together are not — they took the ubuntu job from 218.83s to
          # 250.07s against a 4-minute budget, and a job killed by the budget writes
          # no `[test] suite complete` marker, which is the only thing that reddens
          # this workflow. The tree runs locally and under its own runners.
          GENESIS_TOOLS_TEST_SKIP_DEVDASHBOARD: "1"
        run: |
          set -o pipefail
          # `--parallel` with no number, i.e. one worker per core, and that is measured rather
          # than assumed. About 40% of this step is NOT test execution: from CI's own numbers,
          # (508 s of summed per-test time + 1272 files x X) / 4 = 229 s gives X = 363 ms per
          # FILE of module evaluation before it asserts anything. Oversubscribing would only
          # help if that were latency. It is not: the same tree measured 229.4 s at 4 workers
          # and 233.4 s at 6 (runs 34910083066 and 34910148128). Do not try 8.
          bun run test 2>&1 | tee "test-${{ runner.os }}.log"

      # 🛑 The test step is `continue-on-error: true`, so a failing test does NOT fail the
      # job and `conclusion: success` does NOT mean the tests passed. Through the whole
      # 2026-09-14 campaign every PR read "all checks green" while master itself carried 31
      # failures, because the count lived only in the raw log. This step puts it where a
      # reader sees it without opening anything.
      # 🛑 The rendering is a SCRIPT, not inline shell, because shell inside YAML cannot be
      # tested and the first version of this logic was wrong on the path that matters most.
      # It aborted under the `-eo pipefail` that GitHub applies to `shell: bash`: `grep`
      # exits 1 when a green log has no `(fail)` lines, so the step died at its first
      # assignment, wrote nothing, and reddened the job on a PASSING suite. The
      # `LOG UNREADABLE` branch was unreachable for the same reason. See
      # `scripts/ci/summarize-tests.test.ts`, which drives all five input classes.
      #
      # `continue-on-error` for the same reason the "Slowest test files" step below carries
      # it: a SUMMARY must never fail the job. A suite that cannot terminate is already
      # caught by the `[test] suite complete` step, which is deliberately not
      # continue-on-error, so nothing is lost by making this one unable to redden a run.
      - name: Summarize results
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/ci/summarize-tests.sh \
            "test-${{ runner.os }}.log" \
            "${{ runner.os }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.tests.outcome }}" \
            >> "$GITHUB_STEP_SUMMARY"

      # bun prints `(pass) name [N ms]` under a `path.test.ts:` header on the
      # runner (it does not locally), so the log already holds per-test timings.
      # Summing them per file header is a ranking, not a wall clock (imports and
      # setup are outside the brackets); `bun run test --profile` gives wall time.
      # A summary must never fail the job: continue-on-error, no `set -e`, and no
      # `head` after `sort` (with pipefail, head closing the pipe early kills sort
      # with SIGPIPE and the step went red on its first real run, 34373807424).
      - name: Slowest test files
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          log="test-${{ runner.os }}.log"
          [ -f "$log" ] || exit 0
          {
            echo '<details><summary>Slowest 25 test files — sum of per-test ms under each file header</summary>'
            echo ''
            echo '```'
            awk '/^src\/.*\.test\.tsx?:$/ { f = $0 } /\[[0-9.]+ms\]$/ { if (f != "") { n = split($0, a, "["); v = a[n]; sub(/ms\]$/, "", v); t[f] += v; c[f]++ } } END { for (k in t) printf "%9.1fs %5d  %s\n", t[k] / 1000, c[k], k }' "$log" | sort -rn | awk 'NR <= 25'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-logs-${{ runner.os }}
          path: |
            install-${{ runner.os }}.log
            test-${{ runner.os }}.log
          if-no-files-found: warn

      # A hang and a test failure arrive as the SAME signal above: the `tests`
      # step is continue-on-error, so both land as `outcome == failure` and the
      # summary prints that one word. They are not the same problem. Failures
      # are the discovery signal this workflow exists to collect; a suite that
      # never terminates means every file after the stall was never run at all.
      # For roughly a day that is exactly what happened — a test imported an
      # entrypoint that launched the CLI on import, the CLI blocked on a prompt,
      # and every PR's "tests" step was a 4-minute timeout wearing the costume
      # of an ordinary failure.
      #
      # `scripts/test.ts` writes `[test] suite complete (exit N)` once every
      # phase has exited, and nothing else writes it. That marker rather than
      # bun's own `Ran N tests across M files.` on purpose: a full run is TWO
      # bun processes (the parallel bulk, then the serial load-sensitive phase),
      # so bun's line being present proves only that ONE of them finished — a
      # stalled serial phase would still show a completed parallel one.
      # Deliberately NOT continue-on-error: a suite that cannot terminate has to
      # turn the run red.
      #
      # Verified all directions on bun 1.3.13 before shipping: a passing run and
      # a failing run both emit the marker (discovery stays intact, exit code
      # carried through), a module-scope hang killed mid-run leaves only the
      # startup banner, and an install failure leaves neither. Note bun's own
      # --timeout cannot cover this class at all: it bounds a test BODY, and an
      # import-time stall happens before any test body exists.
      - name: Fail on suite hang (distinct from test failures)
        if: always()
        shell: bash
        run: |
          log="test-${{ runner.os }}.log"
          marker='^\[test\] suite complete'

          if [ ! -f "$log" ]; then
            echo "::error:: $log is missing — the test step produced no log at all."
            exit 1
          fi

          # No banner means bun test never started (install or wrapper failure).
          # That belongs to the install step's discovery signal, not here.
          if ! grep -q '^bun test v' "$log"; then
            echo "bun test never started — leaving this to the install/discovery signal."
            exit 0
          fi

          if ! grep -q "$marker" "$log"; then
            echo "::error:: the suite never reached completion — no '[test] suite complete' marker in $log. This is a HANG or a timeout, NOT a test failure. Last 20 lines follow; the last filename bun printed is the file that stalled."
            tail -n 20 "$log"
            exit 1
          fi

          grep "$marker" "$log" | tail -n 1

      # A per-file runtime ceiling, so one slow test cannot eat the step budget unnoticed
      # again. The budget has now been raised twice (4m, then 5m) because the suite grew
      # into it, and a budget kill arrives disguised as the hang guard above. Linux only:
      # the windows job runs the same files on a 7-minute budget and would only duplicate
      # the finding.
      #
      # 🛑 An exit code above 1 is a BROKEN SCAN, not a pass, and is handled here rather
      # than trusted: four guards in this repo have passed while enforcing nothing because
      # the tool exited 127 and `if` read that as "no matches". The guard catches its own
      # crashes and returns 1, so anything above 1 means it never even got that far.
      - name: Per-file test runtime ceiling
        if: always() && runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          bun scripts/ci/test-runtime-guard.ts "test-${{ runner.os }}.log"
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            echo "::error:: the runtime guard itself exited ${code}, so nothing was enforced. This is a broken scan, not a pass."
            exit 1
          fi
          exit "$code"


  # Lint, typecheck, the repo guards and the sub-project suites, in their OWN job so they
  # run CONCURRENTLY with the test matrix instead of queueing behind it.
  #
  # They used to be ubuntu-only steps at the tail of `test`, which meant the runner sat
  # through the whole 266 s test step before starting ~150 s of checks that need none of its
  # output. Measured on run 34964619758: test step 266 s, then TypeScript check 21 s, biome
  # 18 s, the two DevDashboard suites 29 s, dashboard typecheck+vitest 26 s and the guards.
  # Splitting them costs one extra checkout, setup-bun and install (~30 s, cache-warm) and
  # removes about 150 s from the critical path.
  #
  # The original comment's intent is preserved and strengthened: these can no longer delay
  # the test signal at all, because they are not in its job. Still NOT continue-on-error —
  # a real lint or tsc failure must turn the run red. The per-step timeouts below are the
  # same fail-fast tripwires, measured on 4-core GitHub runners.
  checks:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Keep in step with the `test` job's pin; the reasoning lives there.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # Three guards shell out to it (logging, pid-safety, package boundaries), and the
      # hosted image ships none.
      - name: Install ripgrep
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: ripgrep@14.1.1

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile
      # 🛑 These steps carry NO `if: runner.os == 'Linux'` and must not regain one. The guard
      # was load-bearing while they lived in the `test` job, which has a Windows matrix leg;
      # this job has no matrix and always runs on ubuntu, so the condition would be dead code
      # that reads as though a Windows leg existed. There is likewise no test-discovery or
      # Upload-logs step above them any more — see the job comment for why they moved.
      #
      # Timeouts are fail-fast tripwires from real data (biome ~12s w/ GritQL plugins on 10
      # cores → expect ~30-45s on 4-core GH runners, dashboard ~1s, tsc ~8s) + headroom.
      # Split from the repo-rule checker so each has its own timing and tripwire.
      # `bun run lint` still runs both for humans; CI wants them separable,
      # because a combined number cannot say which half regressed.
      # Lint rules are per-file and syntactic, so on a PR only the diff needs
      # checking — unlike the `TypeScript check` step further down, which must stay
      # whole-tree because a type error travels across files a diff never names. The
      # base commit is fetched at depth 1 because a full-history checkout would
      # pull 350+ MiB and cost more than the linting it saves. Both commands
      # fall back to a full scan if the diff is unavailable for any reason.
      - name: Fetch PR base for changed-file linting
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Run Biome check + repo lint rules
        timeout-minutes: 3
        shell: bash
        run: bash scripts/ci/lint-changed.sh "${{ github.event.pull_request.base.sha }}"

      - name: Run Biome check (src/claude-history-dashboard)
        timeout-minutes: 2
        run: bun run lint:dashboard

      # src/dashboard is a SEPARATE bun workspace with its own lockfile and its
      # own vitest suite, and nothing above reaches it — the step named
      # "dashboard" right above lints src/claude-history-dashboard, a different
      # directory. That gap let PR #340 sit green with a lockfile its manifest
      # contradicted and a suite that failed on import. These three steps close
      # it: the frozen install proves package.json and bun.lock agree, then the
      # app's own check-types and vitest run.
      - name: Install src/dashboard (frozen lockfile)
        timeout-minutes: 5
        run: bun run install:dashboard-web

      - name: TypeScript check (src/dashboard/apps/web)
        timeout-minutes: 3
        run: bun run typecheck:dashboard-web

      - name: Vitest (src/dashboard/apps/web)
        timeout-minutes: 5
        run: bun run test:dashboard-web

      # DevDashboard is the same gap src/dashboard had, one level worse: the
      # step above sets GENESIS_TOOLS_TEST_SKIP_DEVDASHBOARD=1, so the whole
      # tree this branch adds is excluded from the discovery suite. That is
      # correct there — bun's discovery swallows the cloud's vitest files and
      # the WDIO specs, and the 97 files cost the ubuntu job 31s against a
      # 4-minute budget — but it left the new auth/billing/store guarantees
      # with no CI coverage at all. These steps give them their own runners
      # instead, the same shape as the three src/dashboard steps above.
      # Measured locally: shared 11 tests/16ms, cloud vitest 39 tests/2.0s,
      # mobile 282 tests/14.7s. Cheap because each suite runs under the
      # runner it was written for.
      # ⚠️ test:dd-mobile is `bun test src/`, deliberately serial. The mobile
      # tree deadlocks under scripts/test.ts --parallel (prints the 16x banner,
      # never writes `[test] suite complete`); do not "optimize" it onto the
      # parallel runner.
      - name: Install DevDashboard cloud (frozen lockfile)
        timeout-minutes: 5
        run: bun run install:dd-cloud

      - name: TypeScript check (DevDashboard cloud)
        timeout-minutes: 3
        run: bun run typecheck:dd-cloud

      - name: Tests (DevDashboard cloud — shared + vitest)
        timeout-minutes: 5
        run: bun run test:dd-cloud

      - name: Install DevDashboard mobile (frozen lockfile)
        timeout-minutes: 8
        run: bun run install:dd-mobile

      - name: TypeScript check (DevDashboard mobile)
        timeout-minutes: 5
        run: bun run typecheck:dd-mobile

      - name: Tests (DevDashboard mobile — unit, serial)
        timeout-minutes: 5
        run: bun run test:dd-mobile

      - name: TypeScript check
        timeout-minutes: 2
        run: bun run typecheck:all

      - name: Logging & output convention guard
        timeout-minutes: 1
        run: bash scripts/ci/logging-guard.sh

      - name: AI credential resolution guard
        timeout-minutes: 1
        run: bash scripts/ci/ai-credentials-guard.sh

      - name: PID recycling guard
        timeout-minutes: 1
        run: bash scripts/ci/pid-safety-guard.sh

      - name: Package boundary guard
        timeout-minutes: 1
        run: bun scripts/ci/check-package-boundaries.ts

      # Catches the shape that made the full suite stop terminating: a test
      # importing an entrypoint that runs the CLI on import. Cheap, and it fires
      # before the timeout does, so the failure names the cause.
      - name: Entrypoint import guard
        timeout-minutes: 1
        run: bun scripts/ci/entrypoint-import-guard.ts
