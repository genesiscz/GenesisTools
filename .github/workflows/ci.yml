name: CI

on:
  push:
    branches: [master, main]
  # Every base branch, so stacked PRs get CI too. Drafts are skipped by the
  # job-level `if` below and run once the PR is marked ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  # Decide which OSes the test matrix runs on.
  # ubuntu always; windows-latest only when the PR opts in via title/label
  # containing "windows" (case-insensitive), or on manual workflow_dispatch.
  setup:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Emit `include` objects so each OS carries its own testTimeout —
          # referenced as ${{ matrix.testTimeout }} (a plain matrix int IS
          # valid in step-level timeout-minutes; only non-matrix contexts /
          # raw ternaries are rejected there).
          # testTimeout from real last-20-runs data: ubuntu test discovery
          # med 66s / max 146s -> 4m. The task/tests integration lane is gated
          # out of the default suite (see package.json `test`) and run on demand
          # via `bun run test:task`, so it is not part of this step's budget.
          # windows med 136s / healthy ~150s -> 7m.
          inc='{"os":"ubuntu-latest","testTimeout":4}'
          win=false
          if [ "$EVENT" = "workflow_dispatch" ]; then win=true; fi
          title_lc=$(printf '%s' "$PR_TITLE" | tr '[:upper:]' '[:lower:]')
          labels_lc=$(printf '%s' "$PR_LABELS" | tr '[:upper:]' '[:lower:]')
          case "$title_lc" in *windows*) win=true ;; esac
          case "$labels_lc" in *windows*) win=true ;; esac
          if [ "$win" = "true" ]; then inc="$inc, {\"os\":\"windows-latest\",\"testTimeout\":7}"; fi
          echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          echo "Selected matrix include: [$inc] (windows opted-in: $win)"

  # Single job (no separate `check` runner — cheaper). Lint/typecheck run as
  # ubuntu-only steps AFTER test discovery + Upload logs, so they can never
  # block or delay the test signal — the test discovery step is
  # continue-on-error and uploads its log before lint/tsc even start.
  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Backstop only — must exceed the per-OS testTimeout (4m/7m) + cold
    # install (windows ~237s) + ubuntu lint/tsc so step tripwires + Upload
    # logs fire first. Real worst case ~12m (windows cold); 15m has margin.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # The hosted images ship no ripgrep (actions/runner-images#12179, closed
      # NOT_PLANNED) and the history search, the shell-quirks extractor and the
      # fable enumerator shell out to it. A prebuilt release binary lands on
      # PATH in a few seconds; no apt, no sudo. Same version the vendored
      # fallback in src/utils/ripgrep.ts carries, so both paths behave alike.
      - name: Install ripgrep
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: ripgrep@14.1.1

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Discovery phase: capture how far install gets on each OS too.
      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee "install-${{ runner.os }}.log"

      # Run the WHOLE suite. Discovery only — never fail the job here; the
      # signal is the log, not the exit code. bun test continues past failing
      # files, so one log = full failure inventory for this OS.
      # Tripwire: per-OS matrix.testTimeout (ubuntu 2m, windows 7m). A plain
      # matrix int IS valid in step-level timeout-minutes (matrix resolves at
      # job-expansion); only raw ternaries / non-matrix contexts are rejected.
      # On timeout the partial tee'd log still uploads (continue-on-error).
      - name: Run tests (full suite, discovery)
        id: tests
        continue-on-error: true
        timeout-minutes: ${{ matrix.testTimeout }}
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "test-${{ runner.os }}.log"

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ runner.os }} — test discovery"
            echo ""
            echo "- install step outcome: \`${{ steps.install.outcome }}\`"
            echo "- tests step outcome: \`${{ steps.tests.outcome }}\`"
            echo ""
            echo '<details><summary>Last 60 lines of test log</summary>'
            echo ""
            echo '```'
            tail -n 60 "test-${{ runner.os }}.log" 2>/dev/null || echo "(no test log)"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-logs-${{ runner.os }}
          path: |
            install-${{ runner.os }}.log
            test-${{ runner.os }}.log
          if-no-files-found: warn

      # A hang and a test failure arrive as the SAME signal above: the `tests`
      # step is continue-on-error, so both land as `outcome == failure` and the
      # summary prints that one word. They are not the same problem. Failures
      # are the discovery signal this workflow exists to collect; a suite that
      # never terminates means every file after the stall was never run at all.
      # For roughly a day that is exactly what happened — a test imported an
      # entrypoint that launched the CLI on import, the CLI blocked on a prompt,
      # and every PR's "tests" step was a 4-minute timeout wearing the costume
      # of an ordinary failure.
      #
      # `scripts/test.ts` writes `[test] suite complete (exit N)` once every
      # phase has exited, and nothing else writes it. That marker rather than
      # bun's own `Ran N tests across M files.` on purpose: a full run is TWO
      # bun processes (the parallel bulk, then the serial load-sensitive phase),
      # so bun's line being present proves only that ONE of them finished — a
      # stalled serial phase would still show a completed parallel one.
      # Deliberately NOT continue-on-error: a suite that cannot terminate has to
      # turn the run red.
      #
      # Verified all directions on bun 1.3.13 before shipping: a passing run and
      # a failing run both emit the marker (discovery stays intact, exit code
      # carried through), a module-scope hang killed mid-run leaves only the
      # startup banner, and an install failure leaves neither. Note bun's own
      # --timeout cannot cover this class at all: it bounds a test BODY, and an
      # import-time stall happens before any test body exists.
      - name: Fail on suite hang (distinct from test failures)
        if: always()
        shell: bash
        run: |
          log="test-${{ runner.os }}.log"
          marker='^\[test\] suite complete'

          if [ ! -f "$log" ]; then
            echo "::error:: $log is missing — the test step produced no log at all."
            exit 1
          fi

          # No banner means bun test never started (install or wrapper failure).
          # That belongs to the install step's discovery signal, not here.
          if ! grep -q '^bun test v' "$log"; then
            echo "bun test never started — leaving this to the install/discovery signal."
            exit 0
          fi

          if ! grep -q "$marker" "$log"; then
            echo "::error:: the suite never reached completion — no '[test] suite complete' marker in $log. This is a HANG or a timeout, NOT a test failure. Last 20 lines follow; the last filename bun printed is the file that stalled."
            tail -n 20 "$log"
            exit 1
          fi

          grep "$marker" "$log" | tail -n 1

      # Lint/typecheck — ubuntu only (redundant + slow on Windows), and only
      # after test discovery + Upload logs above, so they can't block the
      # test signal. NOT continue-on-error: a real lint/tsc failure should
      # still turn the run red (same signal the old separate `check` job
      # gave), just without its own runner. Timeouts are fail-fast tripwires
      # from real data (biome ~12s w/ GritQL plugins on 10 cores → expect
      # ~30–45s on 4-core GH runners, dashboard ~1s, tsc ~8s) + headroom.
      # Split from the repo-rule checker so each has its own timing and tripwire.
      # `bun run lint` still runs both for humans; CI wants them separable,
      # because a combined number cannot say which half regressed.
      # Lint rules are per-file and syntactic, so on a PR only the diff needs
      # checking — unlike the typecheck above, which must stay whole-tree. The
      # base commit is fetched at depth 1 because a full-history checkout would
      # pull 350+ MiB and cost more than the linting it saves. Both commands
      # fall back to a full scan if the diff is unavailable for any reason.
      - name: Fetch PR base for changed-file linting
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Run Biome check + repo lint rules
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: bash scripts/ci/lint-changed.sh "${{ github.event.pull_request.base.sha }}"

      - name: Run Biome check (src/claude-history-dashboard)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: bun run lint:dashboard

      # src/dashboard is a SEPARATE bun workspace with its own lockfile and its
      # own vitest suite, and nothing above reaches it — the step named
      # "dashboard" right above lints src/claude-history-dashboard, a different
      # directory. That gap let PR #340 sit green with a lockfile its manifest
      # contradicted and a suite that failed on import. These three steps close
      # it: the frozen install proves package.json and bun.lock agree, then the
      # app's own check-types and vitest run.
      - name: Install src/dashboard (frozen lockfile)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bun run install:dashboard-web

      - name: TypeScript check (src/dashboard/apps/web)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: bun run typecheck:dashboard-web

      - name: Vitest (src/dashboard/apps/web)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bun run test:dashboard-web

      - name: TypeScript check
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: bun run typecheck:all

      - name: Logging & output convention guard
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bash scripts/ci/logging-guard.sh

      - name: AI credential resolution guard
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bash scripts/ci/ai-credentials-guard.sh

      - name: PID recycling guard
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bash scripts/ci/pid-safety-guard.sh

      - name: Package boundary guard
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bun scripts/ci/check-package-boundaries.ts

      # Catches the shape that made the full suite stop terminating: a test
      # importing an entrypoint that runs the CLI on import. Cheap, and it fires
      # before the timeout does, so the failure names the cause.
      - name: Entrypoint import guard
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: bun scripts/ci/entrypoint-import-guard.ts
