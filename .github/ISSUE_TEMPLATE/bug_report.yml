name: Bug report
description: Something in a tool or in GenesisTools.app is broken, crashes or behaves differently than it should.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A good report lets someone else see the same failure on their Mac.
        Search [existing issues](https://github.com/genesiscz/GenesisTools/issues) first, and keep one problem per report.
        Every field below says which command prints the answer, so you can paste instead of typing.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: This report covers one problem.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One or two sentences. What did you try to do, and what went wrong?
      placeholder: "Recording a window with the camera bubble on stops after 10 seconds and the movie has no audio."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that someone else can follow. Include the exact command line or the exact buttons you used.
      placeholder: |
        1. Run `tools recorder ...`
        2. Wait 10 seconds
        3. Open the finished movie
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you thought would happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual (error + log)
      description: |
        The error text, copied and not retyped, plus the log lines around the failure.
        Recent failed runs of every tool: `tools genesis-tools logs failures`.
        The day log: `~/.genesis-tools/logs/<YYYY-MM-DD>.log` (daily JSON lines; older days are compressed, read them with `tools genesis-tools logs day --since <date>`).
        Paste only the lines around the failure. A screenshot or a short screen recording helps for UI problems.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected tool
      description: Pick the area that fits best.
      options:
        - recorder
        - meetings
        - hub
        - widget
        - node-repl
        - github
        - ai
        - other
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks my work completely
        - Frequent failure or major degradation
        - Occasional failure
        - Cosmetic
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: GenesisTools commit and its age
      description: "Run `git -C <your GenesisTools checkout> log -1 --format='%h %cr'`. An old checkout is often the whole answer, so update with `git pull` first when you can."
      placeholder: "ab12cd34ef 3 days ago"
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch
      description: "Run `git -C <your GenesisTools checkout> branch --show-current`."
      placeholder: master
    validations:
      required: true

  - type: textarea
    id: app-build
    attributes:
      label: App build
      description: |
        Only for GenesisTools.app problems. Paste the output of `bun run app:status`.
        Write "no app" when you only use the command line tools.
      render: shell
    validations:
      required: false

  - type: input
    id: macos
    attributes:
      label: macOS version and build
      description: "Run `sw_vers` and paste ProductVersion and BuildVersion."
      placeholder: "27.2 (25C100)"
    validations:
      required: true

  - type: input
    id: chip
    attributes:
      label: Chip
      description: "Run `sysctl -n machdep.cpu.brand_string`."
      placeholder: Apple M3 Pro
    validations:
      required: true

  - type: input
    id: bun
    attributes:
      label: Bun version
      description: "Run `bun --version`."
      placeholder: 1.3.13
    validations:
      required: true

  - type: textarea
    id: permissions
    attributes:
      label: Privacy grants
      description: |
        Paste the output of `tools macos permissions`. It shows which macOS grants (Screen Recording, Microphone,
        Calendars, Full Disk Access and others) the app has. A missing grant often looks like an empty result.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The logs, screenshots and output above contain no tokens, secrets, personal data or private file names. I redacted what was there.
          required: true
