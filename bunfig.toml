preload = ["./src/utils/bun/preload-solid-scoped.ts", "./src/utils/search/stores/sqlite-vec-preload.ts"]

[install]
# Supply-chain delay: refuse package versions younger than 7 days (604800s)
minimumReleaseAge = 604800
# Exact-match only, and a standing bypass for every future version of the listed
# package. Nothing goes in here that does not need permanent latest-tracking.
# AI SDK: we track latest majors closely.
minimumReleaseAgeExcludes = [
    # Our own package (genesiscz/darwinkit-swift): consumed the minute it is released.
    "@genesiscz/darwinkit",
    "ai",
    "@ai-sdk/anthropic",
    "@ai-sdk/deepgram",
    "@ai-sdk/google",
    "@ai-sdk/groq",
    "@ai-sdk/openai",
    "@ai-sdk/openai-compatible",
    "@ai-sdk/provider",
    "@ai-sdk/provider-utils",
    "@ai-sdk/gateway",
    "@openrouter/ai-sdk-provider",
]

[test]
preload = [
    # First and before any Database exists: the [test] list REPLACES the global
    # preload, which silently dropped the extension-capable-SQLite swap and made
    # every sqlite-vec suite fail with "no such module: vec0" whenever another
    # test file in the same worker had opened a Database first.
    "./src/utils/search/stores/sqlite-vec-preload.ts",
    # One temp root per test process, removed on a green exit, so fixtures that never clean
    # up cannot fill the temp folder.
    #
    # 🛑 THIS ORDER IS LOAD-BEARING. preload-test-sandbox.ts has no cleanup of its own; its
    # gt-test-home-* directory survives only by landing inside the root this file redirects
    # TMPDIR to. Measured 2026-09-15 by swapping the two lines: a two-file run leaked 2
    # gt-test-home-* directories into the real temp folder (0 before), i.e. one per test file,
    # never removed. Both files carry the same warning at their own end.
    "./src/utils/bun/preload-test-tmpdir.ts",
    "./src/utils/bun/preload-test-sandbox.ts",
    "./src/utils/bun/preload-test-keyring.ts",
    # After the sandbox, because it imports modules that build a Storage at
    # class-eval time and those paths must already point inside the sandbox.
    "./src/utils/bun/preload-test-host-effects.ts",
    "./src/utils/bun/preload-test-process-exit.ts",
    # test-cleanup-preload.ts was REMOVED 2026-09-15: the sandbox means it could never see
    # anything. It wiped stale gt_*_test_ indexes from the user's real homedir, but it ran
    # AFTER preload-test-sandbox.ts had already pointed GENESIS_TOOLS_HOME at a fresh
    # per-process directory. Measured by instrumenting it: readdirSync THREW ENOENT and
    # wipeAllTestIndexes(120_000) returned 0. The real homedir holds no gt_*_test_ entries
    # either, because sandboxed tests never write there. wipeAllTestIndexes() itself stays —
    # store.vacuum.test.ts calls it deliberately.
]
