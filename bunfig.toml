preload = ["./src/utils/bun/preload-solid-scoped.ts", "./src/utils/search/stores/sqlite-vec-preload.ts"]

[install]
# Supply-chain delay: refuse package versions younger than 7 days (604800s)
minimumReleaseAge = 604800
# Exact-match only, and a standing bypass for every future version of the listed
# package. Nothing goes in here that does not need permanent latest-tracking.
# AI SDK: we track latest majors closely.
minimumReleaseAgeExcludes = [
    # Our own package (genesiscz/darwinkit-swift): consumed the minute it is released.
    "@genesiscz/darwinkit",
    "ai",
    "@ai-sdk/anthropic",
    "@ai-sdk/deepgram",
    "@ai-sdk/google",
    "@ai-sdk/groq",
    "@ai-sdk/openai",
    "@ai-sdk/openai-compatible",
    "@ai-sdk/provider",
    "@ai-sdk/provider-utils",
    "@ai-sdk/gateway",
    "@openrouter/ai-sdk-provider",
]

[test]
preload = [
    # First and before any Database exists: the [test] list REPLACES the global
    # preload, which silently dropped the extension-capable-SQLite swap and made
    # every sqlite-vec suite fail with "no such module: vec0" whenever another
    # test file in the same worker had opened a Database first.
    "./src/utils/search/stores/sqlite-vec-preload.ts",
    "./src/utils/bun/preload-test-sandbox.ts",
    "./src/utils/bun/preload-test-keyring.ts",
    "./src/utils/bun/preload-test-process-exit.ts",
    "./src/indexer/lib/test-cleanup-preload.ts",
]
